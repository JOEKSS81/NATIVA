plugins { id 'com.android.application' }

// URL de la web (Vercel). Se puede cambiar con -PwebHost=otro.dominio
def webHost = project.findProperty('webHost') ?: 'jandry.vercel.app'
def vCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.jandry.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jandry.app'
        minSdk 23
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
        resValue 'string', 'appName', 'Jandry'
        resValue 'string', 'launchUrl', "https://${webHost}/"
        resValue 'string', 'webHost', webHost
        resValue 'string', 'assetStatements',
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${webHost}\\\"}}]"
        manifestPlaceholders = [webHost: webHost]
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: '../jandry.keystore')
            storePassword System.getenv('KS_PASS')
            keyAlias 'volta'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
